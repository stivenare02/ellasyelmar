<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Nunito+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet">
<title>Ellas y el mar | Ropa de playa</title>
<style>
:root{--bg:#fbf7f0;--fg:#1f3b5c;--card:#fff;--mut:#5d7186;--acc:#1f3b5c;--cta:#f08a6f;--ctat:#13263f;--ok:#128c4a;--okt:#0e7a42;--no:#a8452f;--bd:#eadfce;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b29;--fg:#eef3f6;--card:#162a3d;--mut:#a3b4c3;--acc:#2b8a94;--okt:#5ad08b;--no:#ff9d86;--bd:#25394d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b29;--fg:#eef3f6;--card:#162a3d;--mut:#a3b4c3;--acc:#2b8a94;--okt:#5ad08b;--no:#ff9d86;--bd:#25394d;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
h1{font:700 27px/1 "Dancing Script",cursive,Georgia,serif;margin:0}h2{margin:0 0 10px}h3{font-size:15px;font-weight:800;margin:8px 0 0}
main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;max-width:900px;margin:auto}
@media(min-width:700px){main{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.ph{position:relative}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bd);display:block}
.off img{opacity:.45}.bd{position:absolute;top:8px;left:8px;background:#1f3b5ce6;color:#fff;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px}
.pr{display:flex;justify-content:space-between;align-items:baseline}.pr b{font-size:18px}.pr small{font-weight:800}.ok{color:var(--okt)}.no{color:var(--no);font-weight:800}
.cz{display:flex;flex-wrap:wrap;gap:4px}.chip{border-radius:99px;min-width:44px;padding:6px 10px;margin:0;font-weight:800}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mut{color:var(--mut)}.bar{padding:10px 14px 0;max-width:900px;margin:auto}
button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:3px 2px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
button:disabled{opacity:.5}button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.cta{background:var(--cta);border-color:var(--cta);color:var(--ctat);font-weight:800}.wa{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:800;width:100%;margin:8px 0}
input{width:100%;box-sizing:border-box;margin:5px 0}input[type=range]{padding:0}
#ov:empty{display:none}.m{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.s{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.hero{text-align:center;padding:18px 14px 4px}.hero img{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;box-shadow:0 6px 24px #1f3b5c26}.hero p{margin:10px auto 0;max-width:34ch;color:var(--mut)}
.tr{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:10px 14px 0;padding:0;font-weight:600;font-size:14px;color:var(--okt)}
.info{max-width:640px;margin:8px auto 28px;padding:0 14px}details{border-top:1px solid var(--bd);padding:10px 0}summary{font-weight:800;cursor:pointer}details p{color:var(--mut);margin:8px 0 0}.end{text-align:center;color:var(--mut);margin-top:18px}
.th{display:flex;gap:4px;overflow-x:auto;padding:2px 0}.tb{padding:0;margin:0;width:46px;height:46px;flex:none;border-radius:9px;overflow:hidden;border:2px solid var(--bd)}.tb.on{border-color:var(--cta)}.card .tb img{width:100%;height:100%;aspect-ratio:auto;border-radius:0}.rw2{display:flex;gap:8px;align-items:center}.rw2 img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.ph img{cursor:zoom-in}.lb{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;color:#fff}.lb img{max-width:100%;max-height:76%;object-fit:contain;border-radius:10px}.lb p{margin:8px 0 0}.lb .nv{display:flex;gap:14px;align-items:center;margin-top:8px}
a.wa{display:block;text-align:center;text-decoration:none;box-sizing:border-box;padding:11px 12px;border-radius:10px}

function render(){
 const n=cart.reduce((a,i)=>a+i.q,0);
 $('#app').innerHTML=`<header><h1>Ellas y el mar</h1><div><button data-a="sh">Compartir</button><button class="pri" data-a="ct">🛍 ${n}</button></div></header><section class="hero"><img src="${LOGO}" alt="Ellas y el mar, ropa de playa"><p>Ropa de playa y resort wear para mujeres que aman el mar.</p></section><ul class="tr"><li>✓ Atención personalizada</li><li>✓ Te ayudamos con tu talla</li><li>✓ Pedido rápido por WhatsApp</li></ul>${admin?`<div class="bar"><button class="cta" data-a="new">＋ Publicar producto</button><br><small class="mut">${saving?'Guardando cambios…':'Toca una talla o el estado para cambiarlos'}</small></div>`:''}<main>${D.p.length?D.p.map(card).join(''):'<p class="mut" style="grid-column:1/-1">Pronto publicaremos nuevas prendas.</p>'}</main><section class="info"><details><summary>¿Quiénes somos?</summary><p>Nos inspiramos en la brisa, la arena y la inmensidad del océano para vestir a mujeres que aman la vida al aire libre. Queremos que cada una se sienta cómoda, segura y natural frente al mar.</p></details><details><summary>¿Qué ofrecemos?</summary><p>Trajes de baño (enterizos y bikinis), salidas de baño y kimonos, vestidos y conjuntos playeros, y accesorios con alma costera: sombreros, bolsos de fibras naturales y joyería de inspiración marina.</p></details><details><summary>¿Cómo comprar?</summary><p>Agrega tus prendas al carrito y envía el pedido por WhatsApp. Te asesoramos con tu talla y estilo, y recibes tu pedido estés donde estés.</p></details><p class="end">✨ ¡Lleva la esencia del mar contigo! ✨</p></section>`;
}
function lines(){const L=cart.map((k,j)=>{const p=D.p.find(x=>x.id==k.id);return p&&av(p)&&{...k,p,j}}).filter(Boolean);return[L,L.reduce((a,k)=>a+k.p.r*k.q,0)]}
function cartV(){
 const[L,t]=lines();
 $('#ov').innerHTML=`<div class="m"><div class="s"><h2>Tu carrito</h2>${L.length?L.map(k=>`<div class="row"><span>${esc(k.p.n)}${lab(k,esc)}<br><small class="mut">${COP(k.p.r)}</small></span><span><button data-a="mn" data-j="${k.j}">−</button> ${k.q} <button data-a="pl" data-j="${k.j}">+</button></span></div>`).join('')+`<p><b>Total: ${COP(t)}</b></p><input id="nm" placeholder="Tu nombre" value="${esc(nm)}"><button class="wa" data-a="send">Enviar pedido por WhatsApp</button>`:'<p class="mut">Aún no has agregado prendas.</p>'}<button data-a="x">Cerrar</button></div></div>`;
 const i=$('#nm');if(i)i.oninput=()=>nm=i.value;
}
function newV(){
 $('#ov').innerHTML=`<div class="m"><div class="s"><h2>Publicar producto</h2><input type="file" id="f" accept="image/*" multiple><div id="fl"></div><p class="mut" style="margin:6px 0">Puedes subir varias fotos o colores del mismo modelo: todos valen lo mismo. Escribe el color de cada foto (opcional).</p><input id="n" placeholder="Nombre de la prenda"><input id="c" type="number" inputmode="numeric" placeholder="Costo en COP"><p class="mut" style="margin:8px 0 4px">Tallas disponibles (sin tallas = talla única)</p><div id="zs" class="cz">${SZ.map(z=>`<button class="chip" data-a="zt" data-z="${z}">${z}</button>`).join('')}</div><p><button id="zav" class="chip on" data-a="zav">✓ Disponible</button></p><label>Rentabilidad: <b id="mv">30</b>%<input id="m" type="range" min="20" max="40" value="30"></label><p id="pv" class="mut"></p><button class="cta" data-a="pub">Publicar</button><button data-a="x">Cancelar</button></div></div>`;
 const u=()=>{const c=+$('#c').value;$('#mv').textContent=$('#m').value;$('#pv').textContent=c?'Precio de venta: '+COP(price(c,+$('#m').value)):''};
 $('#c').oninput=()=>{const c=+$('#c').value;if(c)$('#m').value=sug(c);u()};$('#m').oninput=u;$('#f').onchange=()=>{$('#fl').innerHTML=[...$('#f').files].slice(0,6).map(f=>`<div class="rw2"><img src="${URL.createObjectURL(f)}" alt=""><input class="cn" placeholder="Color (ej: Coral)"></div>`).join('')};
}
const toImg=f=>new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.src=u});
async function save(){
 if(!art){saving=false;render();const e=$('#pv');if(e)e.textContent='No se pudo publicar desde aquí.';return}
 const c=document.documentElement.cloneNode(true);
 c.querySelector('#app').innerHTML='';c.querySelector('#ov').innerHTML='';
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 try{await art.publish('<!doctype html>'+c.outerHTML)}catch(e){saving=false;render();const p=$('#pv');if(p)p.textContent='Error al publicar: '+(e.code||e.message)}
}
function lbx(id){const p=D.p.find(x=>x.id==id),k=ci[id]||0,n=p.m.length,cur=p.m[k]||p.m[0];
 $('#ov').innerHTML=`<div class="lb" data-a="x"><img src="${cur.i}" alt="${esc(p.n)}"><p>${esc(p.n)}${cur.c?', color '+esc(cur.c):''}</p>${n>1?`<div class="nv"><button data-a="lp" data-id="${id}" aria-label="Anterior">‹</button><span>${k+1} de ${n}</span><button data-a="ln" data-id="${id}" aria-label="Siguiente">›</button></div>`:''}<button data-a="x" style="margin-top:10px">Cerrar</button></div>`}
const LINK=(/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname))?location.href:'https://claude.ai/artifact/HWc1LCfjHTnFjAXKEkJFfw';
function shV(){$('#ov').innerHTML=`<div class="m"><div class="s"><h2>Compartir catálogo</h2><input id="lk" readonly value="${LINK}"><a class="wa" href="https://wa.me/?text=${encodeURIComponent('Catálogo Ellas y el mar '+LINK)}" target="_blank" rel="noopener">Enviar por WhatsApp</a><button data-a="cp" data-t="lk">Copiar link</button> <small id="cpm" class="mut"></small><br><button data-a="x">Cerrar</button></div></div>`}
function ordV(u,m){$('#ov').innerHTML=`<div class="m"><div class="s"><h2>Envía tu pedido</h2><p class="mut">Si WhatsApp no se abrió, copia tu pedido y envíalo al +57 300 137 0610.</p><textarea id="tx" readonly rows="6" style="width:100%;box-sizing:border-box;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit">${esc(m)}</textarea><a class="wa" href="${esc(u)}" target="_blank" rel="noopener">Abrir WhatsApp</a><button data-a="cp" data-t="tx">Copiar pedido</button> <small id="cpm" class="mut"></small><br><button data-a="x">Cerrar</button></div></div>`}
const queue=()=>{saving=true;render();clearTimeout(tm);tm=setTimeout(save,1200)};
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id,j=+b.dataset.j,p=D.p.find(x=>x.id==id);
 if(a=='pk'){sel[id]=b.dataset.z;delete warn[id];render()}
 else if(a=='cl'){ci[id]=+b.dataset.q;render()}
 else if(a=='zm')lbx(id);
 else if(a=='lp'||a=='ln'){const n=p.m.length;ci[id]=((ci[id]||0)+(a=='ln'?1:-1)+n)%n;lbx(id);render()}
 else if(a=='add'){if(p.s.length&&!sel[id]){warn[id]=1;render();return}const v=sel[id]||'',c=(p.m[ci[id]||0]||{}).c||'',k=cart.find(x=>x.id==id&&x.s==v&&x.c==c);k?k.q++:cart.push({id,s:v,c,q:1});render()}
 else if(a=='sz'){p.s=SZ.filter(z=>z==b.dataset.z?!p.s.includes(z):p.s.includes(z));queue()}
 else if(a=='tg'){p.a=!av(p);queue()}
 else if(a=='zt')b.classList.toggle('on');
 else if(a=='zav'){b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓ Disponible':'Agotado'}
 else if(a=='ct')cartV();
 else if(a=='x')$('#ov').innerHTML='';
 else if(a=='pl'){cart[j].q++;cartV();render()}
 else if(a=='mn'){if(--cart[j].q<1)cart.splice(j,1);cartV();render()}
 else if(a=='send'){const[L,t]=lines();if(!L.length)return;
  const m=`Hola Ellas y el mar 👋 Quiero hacer este pedido:\n${L.map(k=>`• ${k.q} × ${k.p.n}${lab(k)}: ${COP(k.p.r*k.q)}`).join('\n')}\nTotal: ${COP(t)}${nm?'\nNombre: '+nm:''}`;
  const u=`https://wa.me/${W}?text=${encodeURIComponent(m)}`;if(!window.open(u,'_blank'))ordV(u,m)}
 else if(a=='sh')shV();
 else if(a=='cp'){const i=$('#'+b.dataset.t);i.select();let ok=false;try{await navigator.clipboard.writeText(i.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(_){}}$('#cpm').textContent=ok?'Copiado':'Mantén presionado el texto para copiarlo'}
 else if(a=='new')newV();
 else if(a=='pub'){const fs=[...$('#f').files].slice(0,6),nms=[...document.querySelectorAll('#fl .cn')].map(x=>x.value.trim()),n=$('#n').value.trim(),c=+$('#c').value;
  if(!fs.length||!n||!c){$('#pv').textContent='Falta la foto, el nombre o el costo.';return}
  b.disabled=true;D.p.unshift({id:Date.now().toString(36),n,r:price(c,+$('#m').value),s:[...document.querySelectorAll('#zs .on')].map(x=>x.dataset.z),a:$('#zav').classList.contains('on'),m:await Promise.all(fs.map(async(f,q)=>({i:await toImg(f),c:nms[q]||''})))});saving=true;save()}
 else if(a=='del'){b.textContent='¿Seguro?';b.dataset.a='del2'}
 else if(a=='del2'){D.p=D.p.filter(x=>x.id!=id);queue()}
});
render();
(async()=>{try{const c=window.claude;if(!c)return;const u=await c.use('user');art=await c.use('artifact');if(u&&u.isOwner()){admin=true;render()}}catch(e){}})();
</script>
</body></html>
